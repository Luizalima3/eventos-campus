{% extends 'eventos/base.html' %}
{% block titulo %}Criar conta{% endblock %}
{% block conteudo %}
<div class="card" style="max-width:420px;margin:0 auto;">
  <h1>Criar conta</h1>
  <p>Ao criar uma conta você se torna um participante: pode se inscrever em eventos e atividades.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primario" type="submit">Criar conta</button>
  </form>
</div>
{% endblock %}
