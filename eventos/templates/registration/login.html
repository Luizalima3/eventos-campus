{% extends 'eventos/base.html' %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="card" style="max-width:420px;margin:0 auto;">
  <h1>Entrar</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primario" type="submit">Entrar</button>
  </form>
  <p>Não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a></p>
</div>
{% endblock %}
